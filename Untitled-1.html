<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Идеальный починенный грузовик</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(#b3e5fc 50%, #81c784 50%);
            overflow: hidden;
            position: relative;
        }

        
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            margin-top: -20px;
            left: 0;
            width: 100%;
            height: 40px;
            background: #555;
            border-top: 4px dashed #fff; 
        }

        
        .truck {
            position: absolute;
            top: 50%;
            margin-top: -75px; 
            width: 200px;
            height: 80px;
            
           
            background: linear-gradient(to right, 
                #e53935 130px, 
                transparent 130px, 
                transparent 133px, 
                #ffb300 133px, 
                #ffb300 195px, 
                transparent 195px
            );
            
            animation: drive 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        
        .truck::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(110deg, transparent 165px, #b3e5fc 165px, #b3e5fc 185px, transparent 185px) no-repeat top left / 100% 40px,
                linear-gradient(#fff, #fff) no-repeat 195px 50px / 5px 10px;
        }

       
        .wheel {
            position: absolute;
            bottom: -15px; 
            width: 30px;
            height: 30px;
            background: #222; 
            border: 5px solid #eee;
            border-radius: 50%; 
            box-sizing: border-box;
            
            
            background-image: linear-gradient(to right, transparent 45%, #fff 45%, #fff 55%, transparent 55%);
            
            
            animation: spin 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        
        .back-wheel {
            left: 25px; 
        }

        .front-wheel {
            left: 145px; 
        }

        
        @keyframes drive {
            0% {
                left: -210px; 
            }
            100% {
                left: calc(100% - 200px - 50px); 
            }
        }

        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(1080deg); } 
        }
    </style>
</head>
<body>

    <div class="truck">
        <div class="wheel back-wheel"></div>
        <div class="wheel front-wheel"></div>
    </div>

</body>
</html>
